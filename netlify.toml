[build]
  publish = "."
  command = ""

# Images and fonts never change name, so browsers can cache them for a long time
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# styles.min.css is linked with a ?v= fingerprint that changes with every edit
[[headers]]
  for = "/styles.min.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# One official address: send the temporary Netlify address to the real domain
[[redirects]]
  from = "https://dodo-planet.netlify.app/*"
  to = "https://dodoplanet.ng/:splat"
  status = 301
  force = true

# Build tools and notes are not part of the website
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# Send visitors on the temporary Netlify address to the real domain
[[redirects]]
  from = "https://dodo-planet.netlify.app/*"
  to = "https://dodoplanet.ng/:splat"
  status = 301
  force = true
